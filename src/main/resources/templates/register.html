
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration - Smart Civic</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #123b68, #087eaf);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .register-box {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #123b68;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #087eaf;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #123b68;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #087eaf;
            text-decoration: none;
            font-weight: bold;
        }
.password-box {
    position: relative;
    width: 100%;
    margin-bottom: 18px;
}

.password-box input {
    width: 100%;
    padding: 12px 45px 12px 12px;
    margin-bottom: 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

.password-box button {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    padding: 5px;
    background: transparent;
    color: #123b68;
    border: none;
    cursor: pointer;
    font-size: 18px;
}

.password-box input {
    width: 100%;
    padding-right: 45px;
}

.password-box button {
    position: absolute;
    right: 10px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
}
    </style>
</head>

<body>

<div class="register-box">

    <h2>Create Citizen Account</h2>
    <p class="subtitle">Join Smart Civic Complaint System</p>
<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<p th:if="${success}" th:text="${success}" style="color:green;"></p>

    <form action="/register" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Mobile Number</label>
        <input type="tel" name="mobile" placeholder="Enter mobile number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label>Password</label>
        <div class="password-box">
    <input type="password" id="password" name="password"
           placeholder="Create password" minlength="8" required>
    <button type="button" onclick="togglePassword('password')">👁</button>
</div>

        <label>Confirm Password</label>
        <div class="password-box">
    <input type="password" id="confirmPassword" name="confirmPassword" required>
    <button type="button" onclick="togglePassword('confirmPassword')">👁</button>
</div>

        <button type="submit">Sign Up</button>

    </form>

    <p class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>
<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);

        if (field.type === "password") {
            field.type = "text";
        } else {
            field.type = "password";
        }
    }
</script>
</body>
</html>
