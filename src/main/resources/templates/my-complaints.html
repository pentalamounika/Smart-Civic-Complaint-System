
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints - Smart Civic</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
        }

        h2 { color: #243047; }

        .complaint-card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            background: #fff3cd;
            color: #856404;
            border-radius: 5px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #243b80;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .feedback-btn {
            display: inline-block;
            padding: 10px 16px;
            background: #198754;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 12px;
        }

        .feedback-btn:hover {
            background: #146c43;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>My Complaints</h2>

    <div th:if="${success}" th:text="${success}"
         style="background:#d4edda; color:#155724;
                padding:12px; margin:15px 0; border-radius:6px;">
    </div>

    <p>View and track all your submitted complaints.</p>

    <div th:if="${complaints == null or complaints.isEmpty()}"
         class="empty">
        <p>You have not submitted any complaints yet.</p>
    </div>

    <div th:each="complaint : ${complaints}"
         class="complaint-card">

        <h3 th:text="${complaint.title}"></h3>

        <p><strong>Complaint ID:</strong>
            <span th:text="${complaint.id}"></span>
        </p>

        <p><strong>Category:</strong>
            <span th:text="${complaint.category}"></span>
        </p>

        <p><strong>Description:</strong>
            <span th:text="${complaint.description}"></span>
        </p>

        <p><strong>Location:</strong>
            <span th:text="${complaint.location}"></span>
        </p>

        <div th:if="${complaint.photoPath != null}">
            <p><strong>Complaint Photo:</strong></p>
            <img th:src="@{${complaint.photoPath}}"
                 alt="Complaint Photo"
                 style="width:250px; max-height:200px;
                        object-fit:cover; border-radius:8px;
                        margin:10px 0;">
        </div>

        <p><strong>Submitted On:</strong>
            <span th:text="${#temporals.format(complaint.submittedAt, 'dd-MM-yyyy HH:mm')}"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span class="status" th:text="${complaint.status}"></span>
        </p>

        <a th:if="${complaint.status == 'SUBMITTED'}"
           th:href="@{/complaints/edit/{id}(id=${complaint.id})}"
           style="display:inline-block; padding:9px 16px;
                  background:#243b80; color:white;
                  text-decoration:none; border-radius:5px;">
            Edit Complaint
        </a>

        <form th:if="${complaint.status == 'SUBMITTED'}"
              th:action="@{/complaints/delete/{id}(id=${complaint.id})}"
              method="post"
              style="display:inline-block;">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    onclick="return confirm('Are you sure you want to delete this complaint?');"
                    style="padding:9px 16px; background:#dc3545;
                           color:white; border:none; border-radius:5px;
                           cursor:pointer;">
                Delete Complaint
            </button>
        </form>

        <!-- Feedback button for resolved complaints -->
        <div th:if="${complaint.status == 'RESOLVED'}">
            <a th:href="@{/feedback/{id}(id=${complaint.id})}"
               class="feedback-btn">
                Give Feedback
            </a>
        </div>

    </div>

    <a href="/dashboard" class="back">Back to Dashboard</a>

</div>

</body>
</html>
