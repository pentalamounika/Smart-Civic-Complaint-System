
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Login - Smart Civic</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #123b68, #087eaf);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #123b68;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #087eaf;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #123b68;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
        }

        .register-link a {
            color: #087eaf;
            text-decoration: none;
            font-weight: bold;
        }
.password-box {
    position: relative;
    width: 100%;
    margin-bottom: 18px;
}

.password-box input {
    width: 100%;
    padding: 12px 45px 12px 12px;
    margin-bottom: 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

.password-box button {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    padding: 5px;
    background: transparent;
    color: #123b68;
    border: none;
    cursor: pointer;
    font-size: 18px;
}
    </style>
</head>

<body>

<div class="login-box">

    <h2>Citizen Login</h2>
    <p class="subtitle">Welcome back to Smart Civic</p>
<p th:if="${param.error}" style="color:red;">
    Invalid email or password. Please try again.
</p>

<p th:if="${param.logout}" style="color:green;">
    You have logged out successfully.
</p>

<p th:if="${success}" th:text="${success}" style="color:green;"></p>

    <form action="/login" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>Email Address</label>
        <input type="email" name="username"
               placeholder="Enter your email" required>

        <label>Password</label>
 <div class="password-box">
    <input type="password" id="loginPassword" name="password"
           placeholder="Enter password" required>
    <button type="button" onclick="togglePassword('loginPassword')">👁</button>
</div>

        <button type="submit">Login</button>

    </form>

    <p class="register-link">
        Don't have an account?
        <a href="/register">Sign Up</a>
    </p>

</div>
<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);

        if (field.type === "password") {
            field.type = "text";
        } else {
            field.type = "password";
        }
    }
</script>

</body>
</html>
