
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Feedback - Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 25px;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
        }

        h2 {
            color: #243047;
        }

        .feedback-card {
            background: white;
            padding: 22px;
            margin: 18px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .rating {
            color: #e6a000;
            font-size: 20px;
            font-weight: bold;
        }

        .comments {
            background: #eef4fa;
            padding: 15px;
            border-radius: 7px;
            margin-top: 12px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #243b80;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Citizen Feedback</h2>

    <p>View ratings and feedback submitted by citizens.</p>

    <div th:if="${feedbackList == null or feedbackList.isEmpty()}"
         class="empty">
        <p>No feedback has been submitted yet.</p>
    </div>

    <div th:each="feedback : ${feedbackList}"
         class="feedback-card">

        <h3>
            Citizen:
            <span th:text="${feedback.citizen.name}"></span>
        </h3>

        <p>
            <strong>Email:</strong>
            <span th:text="${feedback.citizen.email}"></span>
        </p>

        <p>
            <strong>Complaint ID:</strong>
            <span th:text="${feedback.complaint.id}"></span>
        </p>

        <p>
            <strong>Complaint Title:</strong>
            <span th:text="${feedback.complaint.title}"></span>
        </p>

        <p>
            <strong>Rating:</strong>
            <span class="rating">
                <span th:text="${feedback.rating}"></span> / 5
            </span>
        </p>

        <div class="comments">
            <strong>Citizen Comments:</strong>
            <p th:text="${feedback.comments}"></p>
        </div>

        <p>
            <strong>Submitted On:</strong>
            <span th:text="${#temporals.format(feedback.submittedAt, 'dd-MM-yyyy HH:mm')}"></span>
        </p>

    </div>

    <a href="/admin/dashboard" class="back">
        Back to Admin Dashboard
    </a>

</div>

</body>
</html>
