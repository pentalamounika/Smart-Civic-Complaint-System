
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint - Smart Civic</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 30px 15px;
        }

        .complaint-box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #123b68;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #087eaf;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #123b68;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087eaf;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="complaint-box">

    <h2>Submit a Complaint</h2>
    <p class="subtitle">Report your civic problem to the authorities</p>

    <form th:action="@{/complaints/submit}"
      method="post"
      enctype="multipart/form-data">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label>Complaint Title</label>
        <input type="text" name="title"
               placeholder="Example: Damaged Road" required>

        <label>Complaint Category</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option value="Road">Road Problems</option>
            <option value="Water">Water Supply</option>
             <option value="Water">Sanitation</option>
            <option value="Electricity">Electricity</option>
            <option value="Garbage">Garbage Collection</option>
            <option value="Drainage">Drainage Problems</option>
            <option value="Street Lights">Street Lights</option>
            <option value="Other">Other</option>
        </select>

        <label>Complaint Description</label>
        <textarea name="description"
                  placeholder="Explain your problem in detail..."
                  maxlength="2000" required></textarea>

        <label>Problem Location</label>
        <input type="text" name="location"
               placeholder="Enter area, street or landmark" required>
        <label>Upload Complaint Photo</label>
<input type="file"
       name="photo"
       accept="image/*">

        <button type="submit">Submit Complaint</button>

    </form>

    <a href="/dashboard" class="back-link">
        Back to Dashboard
    </a>

</div>

</body>
</html>
